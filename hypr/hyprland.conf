# bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Add new functionality (using Super/Mod as the modifier)
bind = $mainMod, Up, pass, Prior
bind = $mainMod, Down, pass, Next
bind = $mainMod, Left, pass, Home
bind = Mod2, Right, pass, End

# "Disable" PgUp/PgDn by binding them to nothing
bindi = , Prior, exec, true
bindi = , Next, exec, true

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# bindm = $mainMod, mouse:274, pin

# Moving windows with KB
bind = $mainMod SHIFT, left, movewindoworgroup, l
bind = $mainMod SHIFT, right, movewindoworgroup, r
bind = $mainMod SHIFT, up, movewindoworgroup, u
bind = $mainMod SHIFT, down, movewindoworgroup, d

# bind = $mainMod, END, movetoworkspace, e+4
# bind = $mainMod, HOME, movetoworkspace, e-4

# Media volume
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl  = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Mic volume
bindel = SHIFT, XF86AudioRaiseVolume, exec, pactl set-source-volume @DEFAULT_SINK@ +5%
bindel = SHIFT, XF86AudioLowerVolume, exec, pactl set-source-volume @DEFAULT_SINK@ -5%
bindl  = SHIFT, XF86AudioMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Media playback
bindl = , XF86AudioPlay, exec, playerctl --ignore-player=Gwenview play-pause
bindl = , XF86AudioNext, exec, playerctl --ignore-player=Gwenview next
bindl = , XF86AudioPrev, exec, playerctl --ignore-player=Gwenview previous
bindl = , XF86AudioStop, exec, playerctl --ignore-player=Gwenview stop

# Backlight
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

bind = , XF86Calculator, exec, kcalc
bind = $mainMod, i, exec, systemctl suspend; hyprlock
