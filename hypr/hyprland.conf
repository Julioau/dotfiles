# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor = name,resolution,position,scale
monitorv2 { # Internal
  output = desc:LG Display 0x06E2
  mode = 1920x1080@165
  position = 0x0
  scale = 1
} 

monitorv2 { # Dell 27"
  output = desc:Dell Inc. DELL P2725HE DWWKG34
  mode = 1920x1080@100
  position = 0x-1080
  scale = 1
}
monitorv2 { # Dell 23"
  output = desc:Dell Inc. DELL P2319H 37FW923
  mode = 1920x1080@60
  position = 1920x-1080
  scale = 1
  transform = 3
}
# monitorv2 {
#  output = desc:
#  mode = 600x400@60
#  position = -1920x0
#  scale = 1
#}
monitor =, prefered, auto-up, auto

$mainMod = SUPER

# Setup persistent workspaces
$permanent_ws = 3
exec-once = /home/juli/dotfiles/hypr/persistent_workspaces_daemon.sh $permanent_ws

# Native Split Workspaces Configuration
bind = $mainMod, 1, workspace, r~1
bind = $mainMod, 2, workspace, r~2
bind = $mainMod, 3, workspace, r~3
bind = $mainMod, 4, workspace, r~4
bind = $mainMod, 5, workspace, r~5

bind = $mainMod SHIFT, 1, movetoworkspace, r~1
bind = $mainMod SHIFT, 2, movetoworkspace, r~2
bind = $mainMod SHIFT, 3, movetoworkspace, r~3
bind = $mainMod SHIFT, 4, movetoworkspace, r~4
bind = $mainMod SHIFT, 5, movetoworkspace, r~5

bind = $mainMod CTRL,       up,    workspace,       m-1
bind = $mainMod CTRL SHIFT, up,    movetoworkspace, m-1
bind = $mainMod CTRL,       left,  workspace,       m-1
bind = $mainMod CTRL SHIFT, left,  movetoworkspace, m-1
bind = $mainMod CTRL,       down,  workspace,       m+1
bind = $mainMod CTRL SHIFT, down,  movetoworkspace, m+1
bind = $mainMod CTRL,       right, workspace,       m+1
bind = $mainMod CTRL SHIFT, right, movetoworkspace, m+1

bind = $mainMod SHIFT, X, swapactiveworkspaces, current +1
bind = $mainMod, Z, exec, /home/juli/dotfiles/hypr/cycle_layouts.sh
bind = $mainMod SHIFT, Z, exec, /home/juli/dotfiles/hypr/cycle_layouts.sh prev

# variables
$path = /home/juli/.config/hypr
$wallpaper = 

exec-once = qs
exec-once = hypridle
exec-once = hyprpaper
exec-once = mako
exec-once = hyprpm reload -n
exec-once = /usr/lib/polkit-kde-authentication-agent-1 #for KDE


$fileManager = dolphin #XDG_CURRENT_DESKTOP=kde
$web = google-chrome-stable
$terminal = kitty
$run = pkill wofi || wofi -S run
$menu = pkill wofi || wofi -S drun -I -W 300 -p Apps -l 1 -L 14 -n -i

# clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
bind = $mainMod, V, exec, [float; move cursor 20 20; size ] $terminal -o confirm_os_window_close=0 -o close_on_child_exit=yes -o allow_remote_control=yes -e bash $path/clipfzf.sh
# bind = $mainMod SHIFT, V, exec, [float; move cursor 20 20; size ] $terminal -o confirm_os_window_close=0 -o close_on_child_exit=yes -o allow_remote_control=yes -e bash /home/julio/dotfiles/hypr/clipfzf.sh

env = HYPRCURSOR_THEME, Bibata-Modern-Green-Mocha
env = HYPRCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, kde
env = AQ_NO_MODIFIERS,1
env = AQ_FORCE_LINEAR_BLIT,0
# env = XDG_MENU_PREFIX,plasma-

env = XDG_DESKTOP_DIR,$HOME/Desktop
env = XDG_DOWNLOAD_DIR,$HOME/Downloads
env = XDG_TEMPLATES_DIR,$HOME/Templates
env = XDG_PUBLICSHARE_DIR,$HOME/Public
env = XDG_DOCUMENTS_DIR,$HOME/Documents
env = XDG_MUSIC_DIR,$HOME/Music
env = XDG_PICTURES_DIR,$HOME/Pictures
env = XDG_VIDEOS_DIR,$HOME/Videos

cursor {
    persistent_warps = 1
}

input {
    repeat_delay = 250
    repeat_rate = 50

    follow_mouse = 1

    scroll_button_lock = 0

    scroll_method = on_button_down
    scroll_button = 274

    touchpad {
        natural_scroll = yes
        clickfinger_behavior = true
        disable_while_typing = false
    }
    # tablet {
    #     output = eDP-1
    # }

    sensitivity = 0
}


general {
    gaps_in = 2.5
    gaps_out = 5
    border_size = 2
    col.active_border = rgb(a6e3a1) # rgba(00ff99ee) 45deg
    col.inactive_border = rgba(6c7a89ff)
    gaps_workspaces = -5
    layout = workspacelayout
    # no_cursor_warps = true
    

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    
    snap {
        enabled = true
        border_overlap = true
        respect_gaps = true
    }
}

xwayland {
    force_zero_scaling = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10

    blur {
        enabled = 1
        contrast = 0.8
        brightness = 0.7
        vibrancy = 0.5
        # vibrancy_darkness = 0
        # noise = 0
        size = 16
        passes = 4
        xray = true
        special = false
    }
    
    # layerrule = blur,waybar # for blurring waybar

    # drop_shadow = false
    dim_special = 0
    shadow {
        range          = 0
        render_power   = 1
        color          = rgb(a6e3a1)
        color_inactive = rgb(575268)
    }
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeInOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutSine, 0.61, 1, 0.88, 1
    bezier = easeInOutQuint, 0.83, 0, 0.17, 1
    bezier = easeInCubic, 0.32, 0, 0.67, 0

    animation = windows, 1, 5, default, 
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 0, 10, default
    animation = borderangle, 0, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default, slidevert #for vertical workspaces
    animation = specialWorkspace, 1, 5, default, slidevert
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling.
    preserve_split = true # you probably want this
    # single_window_aspect_ratio = 4 3
    # no_gaps_when_only = 1
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_is_master = false
    mfact = 0.6
    slave_count_for_center_master = 4

}

gestures {
    # See https://wiki.hyprland.org/Configuring/Gestures/ for more
    # gesture = 4, vertical, workspace
    # gesture = 3, down, mod: ALT, close
    # gesture = 3, up, mod: SUPER, scale: 1.5, fullscreen
    # gesture = 3, pinchin, scale: 1.5, float
    
}


misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    vfr = true
    background_color = rgb(1e1e2e)
    # new_window_takes_over_fullscreen = 0
    middle_click_paste = 0
}

group {
    col.border_active = rgb(6ca2f9) # rgba(00ff99ee) 45deg
    col.border_inactive = rgba(6ca2f950)
    col.border_locked_active = rgb(a6e3a1)
    col.border_locked_inactive = rgb(6c7a89)
    
    groupbar {
        height = 0
        # indicator_height = 5
        
        render_titles = true
        font_family = SpaceMono Nerd Font
        font_size = 13
        
        col.active = rgb(6ca2f9)
        col.inactive = rgba(6ca2f950)
        
        col.locked_active = rgb(a6e3a1)
        col.locked_inactive = rgb(43544D)
        
        # round_only_edges = false
        # rounding = 2
        # text_color = rgb(181825)
    }
}

# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device { # external wireless kb
    name         = dell-computer-corp-dell-universal-receiver
    # kb_model   =
    kb_layout    = br 
    # kb_variant   =
    # kb_options =
    # kb_rules   =
}

device { # different kb
    name         = gsr-ui-virtual-keyboard
    kb_model     = inspiron
    kb_layout    = br 
    # kb_variant   =
    # kb_options =
    # kb_rules   =
}


device { # laptop kb
    name         = at-translated-set-2-keyboard
    kb_model     = inspiron
    kb_layout    = br
    # kb_variant   = intl
    # kb_options =
    # kb_rules   =
}

#  █   █ ▀█▀ █▀█ █▀▄ █▀█ █ █   █▀▄ █ █ █   █▀▀ █▀▀
#  █ █ █  █  █ █ █ █ █ █ █▄█   █▀▄ █ █ █   █▀▀ ▀▀█
#   ▀ ▀  ▀▀▀ ▀ ▀ ▀▀  ▀▀▀ ▀ ▀   ▀ ▀ ▀▀▀ ▀▀▀ ▀▀▀ ▀▀▀
windowrule = match:class = .*, suppress_event = maximize # You'll probably like this.
windowrule = float = 1, match:title = (New Text Note — Okular)
windowrule = float = 1, match:class = (xdg-desktop-portal-gtk)
# windowrule   = float, match:title (UFRGS.*)
windowrule = float = 1, match:title = (KCalc)
windowrule = opacity = 0.0 override = 1, no_anim = 1, no_focus = 1, no_dim = 1, decorate = 1, match:title = (.*is sharing (a window|your screen).)
windowrule = float = 1, match:title = ("Can't update Chrome")

#  █▀▀ █▀▀ █▀▄ █▀▀ █▀█ █ █
#  ▀▀█ █   █▀▄ █   █▀▀  █ 
#  ▀▀▀ ▀▀▀ ▀ ▀ ▀▀▀ ▀    ▀ 
windowrule {
  name = scrcpy
  size = 1080 2400,
  pseudo = 1
  keep_aspect_ratio = 1
}

windowrule = keep_aspect_ratio = 1, match:title = (Picture in picture)
windowrule = pin = 1, match:title = (Picture in picture)
# windowrule = xray = 1, match:class kitty
windowrule = no_anim = 1, match:title = ($menu)
# windowrule = float =, match:title (nwg-clipman)
# windowrule = minsize = 300 500, match:title (nwg-clipman)
# windowrule = size = 949 1036, match:title (nwg-clipman)
# windowrule = move 964 37, match:title (nwg-clipman)
windowrule = opacity = 0, match:title zoom
windowrule = no_initial_focus = 1, match:title zoom

#  █   █ █▀█ █▀▄ █ █ █▀▀ █▀█ █▀█ █▀▀ █▀▀   █▀▄ █ █ █   █▀▀ █▀▀
#  █ █ █ █ █ █▀▄ █▀▄ ▀▀█ █▀▀ █▀█ █   █▀▀   █▀▄ █ █ █   █▀▀ ▀▀█
#   ▀ ▀  ▀▀▀ ▀ ▀ ▀ ▀ ▀▀▀ ▀   ▀ ▀ ▀▀▀ ▀▀▀   ▀ ▀ ▀▀▀ ▀▀▀ ▀▀▀ ▀▀▀
windowrule = workspace special:magic silent, match:initial_title ^(YouTube Music)$
windowrule = workspace special:magic, match:initial_title ^(web.whatsapp.com)$
windowrule = workspace special:magic, match:initial_title ^(discord.com_/channels/@me)$

# windowrule = size 100% 20%, match:title (New Text Note — Okular)

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
binds {
    movefocus_cycles_fullscreen = 1
}

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind  = $mainMod, T, exec, $terminal
bind  = $mainMod, Q, killactive,
bind  = $mainMod, ESCAPE, exit,
bind  = $mainMod, L, exec, hyprlock
bind  = $mainMod, E, exec, $fileManager
bind  = $mainMod, F, togglefloating,
bindr = $mainMod, R, exec, [] $menu
bind  = $mainMod, P, pin
bind  = $mainMod, M, pseudo, # dwindle
bind  = $mainMod, W, exec, $web
bind  = $mainMod, X, togglesplit,
bind  = $mainMod, B, exec, bluetoothctl connect 40:35:E6:2D:27:46 || notify-send "Buds-FE" "Connection failed." # Buds-FE
bind  = $mainMod SHIFT, B, exec, bluetoothctl connect E8:26:CF:90:9B:C6 || notify-send "Dell Headset" "Connection failed." # Dell Headset

#  █▀▀ █▀▀ █▀▄ █▀▀ █▀█ █ █
#  ▀▀█ █   █▀▄ █   █▀▀  █ 
#  ▀▀▀ ▀▀▀ ▀ ▀ ▀▀▀ ▀    ▀ 
bind  = $mainMod, A, exec, scrcpy -K || (kitty lyto && scrcpy -K)
bind  = $mainMod SHIFT, A, exec, $path/adbRes.sh

# Waybar
bind  = $mainMod, H, exec, pkill -SIGUSR1 waybar
bind = $mainMod, D, exec, $path/start-vpn.sh
# bindr = $mainMod, U, exec, wl-copy "$(kitten unicode-input)"
bind  = $mainMod, K, exec, kate
bind  = $mainMod, C, exec, code
bind  = $mainMod SHIFT, K, exec, kile
bind  = $mainMod, O, layoutmsg, orientationcycle
bind  = $mainMod, G, togglegroup
bind  = $mainMod SHIFT, G, lockactivegroup, toggle
# bind  = $mainMod ALT SHIFT, G, removefromgroup
bind  = ALT, TAB, changegroupactive, f
bind  = ALT SHIFT, TAB, changegroupactive, b
# normal screenshot
# normal screenshot
bind  = ,PRINT, exec, hyprpicker -r -z & sleep 0.1 && grim -g "$(slurp -d)" - | wl-copy; pkill hyprpicker
# ocr screenshot -- english
bind  = ALT, PRINT, exec, hyprpicker -r -z & sleep 0.1 && grim -g "$(slurp -d)" - | tesseract stdin stdout 2>/dev/null --psm 4 | sed -E ':a;N;$!ba;s/\n+/\n/g' | wl-copy; pkill hyprpicker
# ocr screenshot -- portuguese
bind  = ALT SHIFT, PRINT, exec, hyprpicker -r -z & sleep 0.1 && grim -g "$(slurp -d)" - | tesseract stdin stdout 2>/dev/null -l por --psm 4 | sed -E ':a;N;$!ba;s/\n+/\n/g' | wl-copy; pkill hyprpicker
# bind  = $mainMod, PRINT, exec, grim -g "$(slurp -d)" - | wl-copy; xdg-open https://gemini.google.com; sleep 3; ydotool key 29:1 47:1 47:0 29:0
bind  = ,F11, fullscreen
bind  = SHIFT, F11, fullscreenstate,0 2 #== bind  = ALT, F11, fakefullscreen
bind  = ALT, F11, fullscreenstate, 1
# bind  = $mainMod, TAB, hycov:toggleoverview
# bind  = $mainMod, H, exec, $waybar
bind = , switch:on:Lid Switch, exec, systemctl suspend; hyprlock

# bind = SUPER, D, exec, ~/.config/hypr/layoutSwitcher.sh


# Move focus with mainMod + arrow keys
bind = $mainMod, left , movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up   , movefocus, u
bind = $mainMod, down , movefocus, d

# Switch workspaces with mainMod CTRL
